model = "grok-5-code"

[ui]
permission_mode = "bypassPermissions"

[sandbox]
profile = "off"

[permission]
allow = ["Bash(git status:*)", "Bash(npm run build:*)", "Bash(npm run test:*)"]
ask = ["Bash(git push:*)"]
deny = ["Bash(rm:*)"]

[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
FIXTURE_FLAG = "1"
SERVICE_API_KEY = "sk-test-FAKE-SECRET-123"
